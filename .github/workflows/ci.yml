# Integración continua: ejecuta todas las series de pruebas en Chromium, Firefox y WebKit (en paralelo: un
# trabajo por navegador y varias series a la vez dentro de cada uno) en cada cambio. Si todo pasa en main,
# etiqueta la versión de package.json (v0.x) si esa etiqueta aún no existe.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  series:
    name: Series (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dependencias
        run: npm install
      # Los paquetes del sistema que necesita cada navegador se guardan en la caché de GitHub: el servidor de
      # paquetes de Ubuntu a veces va tan lento que instalarlos superaba los 20 minutos (sobre todo WebKit).
      - name: Caché de paquetes del sistema
        id: aptcache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-cache
          key: apt-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package.json') }}
          restore-keys: apt-${{ runner.os }}-${{ matrix.browser }}-
      - name: Dependencias del navegador (sistema)
        timeout-minutes: 25
        run: |
          mkdir -p ~/apt-cache/partial
          echo "Dir::Cache::Archives \"$HOME/apt-cache\";" | sudo tee /etc/apt/apt.conf.d/99cache-ci
          npx playwright install-deps ${{ matrix.browser }}
          sudo chown -R "$(id -u)" ~/apt-cache && rm -rf ~/apt-cache/partial ~/apt-cache/lock
      - name: Guardar la caché de paquetes (aunque luego fallen las pruebas)
        if: steps.aptcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-cache
          key: apt-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package.json') }}
      - name: Navegador
        timeout-minutes: 10
        # La descarga a veces se queda colgada: hasta 3 intentos de 3 minutos (solo descarga, sin apt).
        run: |
          for i in 1 2 3; do timeout 180 npx playwright install ${{ matrix.browser }} && exit 0; echo "Intento $i fallido"; done; exit 1
      - name: CSP al día
        run: node tools/stamp.js --check
      - name: Pruebas
        run: node tests/run_all.js --parallel
        env:
          BROWSER: ${{ matrix.browser }}
          # Firefox y WebKit dan tiempos de carga irregulares con varias series a la vez en el ejecutor: de una en una.
          JOBS: ${{ matrix.browser == 'chromium' && 3 || 1 }}
          RETRY_FAILED: ${{ matrix.browser == 'chromium' && '0' || '1' }}
          PERF_LIMIT_MS: 5000

  etiqueta:
    name: Etiquetar la versión
    needs: series
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Crear la etiqueta v0.x si no existe
        run: |
          V=$(node -p "require('./package.json').version")
          case "$V" in 0.*) ;; *) echo "La versión $V no es 0.x: no se etiqueta"; exit 1;; esac
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then echo "v$V ya existe"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "Isla & Barra Control $V"
          git push origin "v$V"
